[package]
name = "artnet-client"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = { version = "2.5", default-features = false }
bytes = { version = "1.11", default-features = false }
cfg-if = "1.0"
derive_more = { version = "2.1", default-features = false, features = ["full"] }
derive-new = { version = "0.7", default-features = false }
thiserror = { version = "2.0", default-features = false }
tiny-artnet = { path = "../tiny-artnet/", version = "0.1" }

edge-nal-embassy = { version = "0.8", features = ["proto-ipv4", "udp"] }
edge-net = { version = "0.13", features = [
  "defmt",
  "edge-nal-embassy",
  "embassy"
] }

embassy-executor = { version = "0.10", features = ["defmt"] }
embassy-futures = { version = "0.1", features = ["defmt"] }
embassy-net = { version = "0.8", features = ["alloc", "defmt", "tcp", "udp"] }

tracing = { version = "0.1.44", default-features = false, features = [
  "attributes"
] }
# tracing-defmt = { path = "../tracing-defmt/", version = "*" }

[dev-dependencies]
anyhow = "1.0"
bevy_color = "0.18"
edge-nal-std = "0.6"
iocraft = "0.8"
rand = "0.10"
smol = "2.0"
smol-macros = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[features]
default = ["producer", "receiver"]
producer = []
receiver = []

[profile.release]
opt-level = 3
debug = false
strip = true
lto = "thin"
